<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Appointments | Studio Serena</title>
    <meta name="description" content="Look up, view, or cancel your Studio Serena appointment." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://studioserena.no/appointments.html" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="/style.css?v=13">
    <link rel="stylesheet" href="/css/booking.css?v=10">
    <link rel="stylesheet" href="/css/appointments.css?v=3">
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#faf6ef" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>

<body>
    <div data-include="/partials/cookie-banner.html"></div>
    <div data-include="/partials/nav.html"></div>

    <main>
        <div class="page-header">
            <p class="section-eyebrow" data-en="Manage Your Visit" data-no="Administrer Din Time">Manage Your Visit</p>
            <h1 class="section-title">My <em>Appointments</em></h1>
        </div>

        <div class="appt-lookup">
            <p data-en="Enter the email or phone number you used when booking to view or cancel your appointments." data-no="Skriv inn e-posten eller telefonnummeret du brukte ved bestilling for å se eller avbestille dine timer.">
                Enter the email or phone number you used when booking to view or cancel your appointments.
            </p>
            <div class="wizard-error" id="lookupError"></div>
            <div class="form-row"><label for="lookupEmail">Email</label><input type="email" id="lookupEmail" autocomplete="email"></div>
            <div class="form-row"><label for="lookupPhone">Phone</label><input type="tel" id="lookupPhone" autocomplete="tel"></div>
            <button class="wizard-btn wizard-btn-next" id="lookupBtn" style="margin:0.5rem auto 0;">Find My Appointments</button>
        </div>

        <div class="appt-results" id="apptResults" style="display:none;">
            <div class="appt-section-title" data-en="Upcoming" data-no="Kommende">Upcoming</div>
            <div id="upcomingList"></div>
            <div class="appt-section-title" data-en="Past" data-no="Tidligere">Past</div>
            <div id="pastList"></div>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/include.js"></script>
    <script src="/js/nav.js?v=2" defer></script>
    <script src="/js/cookie-consent.js" defer></script>
    <script type="module" src="/js/appointments.js"></script>
</body>

</html>
