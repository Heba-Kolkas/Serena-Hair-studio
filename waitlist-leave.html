<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leave the waiting list · Studio Serena</title>
<!-- Nothing here should ever be indexed: the URL carries a token that
     identifies one person's place on the list. -->
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #faf6ef; --linen: #fdfaf5; --rule: #ece7df;
    --taupe: #B5A89A; --greige: #9f948e; --espresso: #3f3632;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px;
    background: var(--cream); color: var(--espresso); font-family: var(--font-body);
  }
  .card {
    width: 100%; max-width: 460px; background: var(--linen);
    border-radius: 20px; padding: 44px 32px 38px; text-align: center;
  }
  .mark { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.22em; }
  .sub { font-size: 9px; letter-spacing: 0.42em; color: var(--greige); margin-top: 7px; }
  .rule { width: 44px; height: 1px; background: var(--rule); margin: 24px auto 28px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 27px; margin: 0 0 14px; }
  p { font-size: 14.5px; font-weight: 300; line-height: 1.75; margin: 0 0 18px; }
  .muted { color: var(--greige); font-size: 12.5px; }
  button {
    display: inline-block; padding: 14px 32px; border: none; border-radius: 40px;
    background: var(--taupe); color: #fff; font-family: var(--font-body);
    font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer;
  }
  button[disabled] { opacity: 0.5; cursor: default; }
  a.back {
    display: inline-block; margin-top: 20px; color: var(--greige);
    font-size: 12px; text-decoration: underline; text-underline-offset: 3px;
  }
  .ok { color: #3B7355; }
  .bad { color: #A8503C; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">STUDIO SERENA</div>
    <div class="sub">H A I R</div>
    <div class="rule"></div>
    <div id="view">
      <h1>Leave the waiting list?</h1>
      <p>We will stop letting you know when a time opens up. You can rejoin whenever you like.</p>
      <button id="go">Take me off the list</button>
      <a class="back" href="/book.html">Or see what is available now</a>
    </div>
  </div>

<script type="module">
  // Deliberately a confirmation rather than a one-click removal on load.
  // Mail clients and security scanners fetch every link in an email to check
  // it, and a page that removes on GET would take people off the list who
  // never touched it.
  import { supabase } from '/js/supabase-client.js';

  const token = new URLSearchParams(location.search).get('t') || '';
  const view = document.getElementById('view');

  if (!token) {
    view.innerHTML = '<h1>Link not recognised</h1>'
      + '<p class="muted">This link is missing its code. Use the link in the email exactly as it was sent, '
      + 'or message us on Instagram <strong>@studioserena.hair</strong> and we will take you off.</p>'
      + '<a class="back" href="/book.html">See available times</a>';
  } else {
    document.getElementById('go').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = 'One moment…';
      const { error } = await supabase.rpc('leave_waitlist', { p_token: token });
      if (error) {
        view.innerHTML = '<h1>That did not work</h1>'
          + '<p class="bad">' + (error.message || 'Something went wrong.') + '</p>'
          + '<p class="muted">Message us on Instagram <strong>@studioserena.hair</strong> and we will take you off by hand.</p>';
        return;
      }
      view.innerHTML = '<h1>Done</h1>'
        + '<p class="ok">You are off the waiting list.</p>'
        + '<p class="muted">We will not message you about openings again. If you change your mind, '
        + 'you can join again from the booking page any time.</p>'
        + '<a class="back" href="/book.html">See available times</a>';
    });
  }
</script>
</body>
</html>
